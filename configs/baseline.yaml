# Upstream tokamark_baseline/src/config/config_model.yaml, with our data/output paths.
# deviates in two ways, both marked below
subset_of_shots:
shuffle: false            # upstream: true. false keeps the shot order deterministic between runs
local: true

store_manager_settings:
  base_local_zarr_path: data

# not an upstream key: read by run_training.py / run_evaluation.py, which take the split CSV from it.
# download.py writes data/shots_random.csv for the shots actually on disk.
data_splits_dir: /../../data

dataloader_setting:
  batch_size: 512
  num_workers: 0            # 0 = main process (avoids silent Kaggle dataloader deadlock in 64MB /dev/shm)

training_args:
  lr: 0.0001
  max_steps: 10000000
  max_epochs: 20            # not upstream: we validate once per epoch, see patches/
  patience: 3               # upstream: 10 validations of 100 steps; here 3 epochs without improvement

paths:
  data_output_directory: /../../runs/baseline
